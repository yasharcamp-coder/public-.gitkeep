<!doctype html><html lang="ku" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سیستەمی حازربوونی کارمەندان</title><link rel="stylesheet" href="style.css"></head><body><header><div><h1>سیستەمی حازربوونی کارمەندان</h1><p>بەڕێوەبردنی کارمەند، هاتن و چوون و کاتژمێری کار</p></div></header><main><section class="cards"><div class="card"><b id="total">0</b><span>کۆی کارمەندان</span></div><div class="card"><b id="present">0</b><span>حازر</span></div><div class="card"><b id="absent">0</b><span>غایب</span></div><div class="card"><b id="out">0</b><span>چوونەدەرەوە</span></div></section><section class="panel"><h2>زیادکردنی کارمەند</h2><form id="employeeForm"><input name="code" placeholder="کۆدی کارمەند" required><input name="name" placeholder="ناوی تەواو" required><input name="national_id" placeholder="ژمارەی زووری / ناسنامە"><input name="address" placeholder="ناونیشانی نیشتەجێبوون"><input name="phone" placeholder="ژمارەی مۆبایل"><input name="department" placeholder="بەشی کارکردن"><input name="job" placeholder="پیشە / جۆری کار"><label>کاتی هاتن<input type="time" name="start_time" value="08:00"></label><label>کاتی چوون<input type="time" name="end_time" value="16:00"></label><button>تۆمارکردن</button></form></section><section class="panel"><div class="row"><h2>حازربوونی ئەمڕۆ</h2><input id="date" type="date"></div><div class="tablewrap"><table><thead><tr><th>کۆد</th><th>ناو</th><th>بەش</th><th>کاتی هاتن</th><th>کاتی چوون</th><th>کاتژمێر</th><th>کردار</th></tr></thead><tbody id="attendance"></tbody></table></div></section><section class="panel"><h2>لیستی کارمەندان</h2><div class="tablewrap"><table><thead><tr><th>کۆد</th><th>ناو</th><th>زووری</th><th>مۆبایل</th><th>بەش</th><th>پیشە</th></tr></thead><tbody id="employees"></tbody></table></div></section></main><script src="app.js"></script></body></html>
